<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#f3e9df" />
    <!--
      The first frame, before the stylesheet exists. In dev the app's CSS is
      injected from the module graph, so a refresh paints one frame with no CSS
      on it: white paper, 8px default margins, every element in browser defaults.
      Declaring the page's own background here makes that frame paper instead of
      white — and, on a dark-preference machine, instead of black. This hex is one
      of the three values index.html cannot read from tokens.css;
      scripts/check-tokens.mjs holds it to --hp-paper.
    -->
    <style>
      html {
        background-color: #f3e9df;
        color-scheme: light;
      }
    </style>
    <title>Wizarding Index — every character, one tower</title>
    <meta
      name="description"
      content="Browse the characters, keep your own list, and write one private note on anyone."
    />
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Crect width='16' height='16' fill='%23f3e9df'/%3E%3Cpath fill='%238c4000' d='M6 1h4v5h5v4h-5v5H6v-5H1V6h5z'/%3E%3C/svg%3E"
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Jersey+15&family=Silkscreen:wght@400;700&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
